name: Update Relic & Price Data

on:
  workflow_dispatch:
  schedule:
    - cron: "5 * * * *"

concurrency:
  group: relic-data-publish
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build Relic Database (A)
        run: python scripts/build_relic_db.py

      - name: Build Price Database (B)
        id: price
        continue-on-error: true
        run: python scripts/build_price_db.py
        env:
          # Legacy read-only compatibility until the one-time plaintext migration finishes.
          PRICE_DATA_SECRET: ${{ secrets.PRICE_DATA_SECRET }}

      - name: Note retained prices after WM order outage
        if: steps.price.outcome == 'failure'
        run: echo '::warning::Price refresh failed; publishing relic definitions with previous price artifacts.'

      - name: 校验明文产物
        run: |
          python3 - <<'PY'
          import json
          import os
          import sys

          files = ['data/prices.json', 'data/prices-summary.json', 'data/item-categories.json', 'data/relics.json', 'data/reward-items.json', 'data/item-names-zh.json']
          bad = []
          for path in files:
              if not os.path.exists(path):
                  bad.append(path + ': missing')
                  continue
              try:
                  obj = json.load(open(path, encoding='utf-8'))
                  if isinstance(obj, dict) and obj.get('ct'):
                      raise ValueError('encrypted wrapper')
              except Exception as error:
                  bad.append(path + ': ' + str(error))
          if bad:
              print('VERIFY FAIL:\n' + '\n'.join(bad))
              sys.exit(1)
          relics = json.load(open('data/relics.json', encoding='utf-8'))
          rewards = json.load(open('data/reward-items.json', encoding='utf-8'))
          names = json.load(open('data/item-names-zh.json', encoding='utf-8'))
          slugs = {item['urlName'] for item in rewards}
          if len(relics) < 700 or len(slugs) != len(rewards) or slugs != set(names):
              sys.exit('VERIFY FAIL: relic/reward/translation coverage mismatch')
          prices = json.load(open('data/prices.json', encoding='utf-8'))
          price_summary = json.load(open('data/prices-summary.json', encoding='utf-8'))
          if prices.get('generated') != price_summary.get('generated'):
              sys.exit('VERIFY FAIL: price full/summary generations differ')
          print('VERIFY OK relic-data')
          PY

      - name: Commit and push changes
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --staged --quiet; then
            echo "No changes to commit"
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "data: update relic & price database [skip ci]"
            git pull --rebase origin main
            git push origin main
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Write data to EdgeOne KV
        env:
          KV_WRITE_TOKEN: ${{ secrets.KV_WRITE_TOKEN }}
        run: |
          set -euo pipefail
          publish() {
            local file="$1"
            local key="$2"
            local payload="/tmp/${key}.json"
            python3 - "$key" "data/$file" "$payload" <<'PY'
          import json, pathlib, sys
          key, source, target = sys.argv[1:]
          value = pathlib.Path(source).read_text(encoding='utf-8')
          json.loads(value)
          pathlib.Path(target).write_text(json.dumps({'key': key, 'value': value}, ensure_ascii=False), encoding='utf-8')
          PY
            curl --silent --show-error --fail-with-body --retry 8 --retry-all-errors \
              --retry-delay 20 --retry-max-time 300 --connect-timeout 20 --max-time 60 \
              -X POST "https://relic.wfspeed.run/api/update-kv" \
              -H "Authorization: Bearer ${KV_WRITE_TOKEN}" \
              -H "Content-Type: application/json" --data-binary "@$payload"
            python3 - "$key" "data/$file" <<'PY'
          import hashlib, sys, urllib.request
          key, source = sys.argv[1:]
          expected = open(source, 'rb').read()
          with urllib.request.urlopen('https://relic.wfspeed.run/api/kv?key=' + key, timeout=60) as response:
              actual = response.read()
          if hashlib.sha256(actual).digest() != hashlib.sha256(expected).digest():
              raise SystemExit('readback hash mismatch for ' + key)
          PY
            rm -f "$payload"
          }
          # 关联数据先发布，prices-summary 和 deep-date summary 最后发布为 ready marker。
          for f in relics.json reward-items.json item-categories.json item-names-zh.json relic-deep-date.json; do
            k="${f//[.-]/_}"
            publish "$f" "$k"
          done
          publish prices-summary.json prices_summary_json
          publish relic-deep-date-summary.json relic_deep_date_summary_json
