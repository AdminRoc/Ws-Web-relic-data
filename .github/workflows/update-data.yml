name: Update Relic & Price Data

on:
  workflow_dispatch:
  schedule:
    - cron: '5 * * * *'

concurrency:
  group: relic-data-update
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build Relic Database (A)
        run: python scripts/build_relic_db.py

      - name: 安装加密依赖
        run: pip install cryptography -q

      - name: Build Price Database (B)
        run: python scripts/build_price_db.py
        env:
          PRICE_DATA_SECRET: ${{ secrets.PRICE_DATA_SECRET }}

      - name: 兜底加密（仅公库暴露内容，含历史明文补加密）
        run: python scripts/encrypt_price.py --all
        env:
          PRICE_DATA_SECRET: ${{ secrets.PRICE_DATA_SECRET }}

      - name: 校验回环（阻断失真）
        env:
          PRICE_DATA_SECRET: ${{ secrets.PRICE_DATA_SECRET }}
        run: |
          python3 -c "
          import sys; sys.path.insert(0, 'scripts'); import crypto_price, glob, json
          files=['data/prices.json','data/prices-summary.json','data/item-categories.json','data/relics.json','data/reward-items.json','data/item-names-zh.json']
          bad=[]
          for p in files:
              import os
              if not os.path.exists(p): continue
              try:
                  obj=crypto_price.load_json(p)
                  assert obj is not None, 'load fail'
                  raw=crypto_price.load_raw(p)
                  assert isinstance(raw, dict) and raw.get('ct'), 'not encrypted'
              except Exception as e:
                  bad.append(p+':'+str(e))
          if bad:
              print('VERIFY FAIL:'+'\n'.join(bad)); sys.exit(1)
          print('VERIFY OK relic-data')
          "

      - name: Commit and push changes
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --staged --quiet; then
            echo "No changes to commit"
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "data: update relic & price database [skip ci]"
            git pull --rebase origin main
            git push origin main
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: 拉取私库 kv_put 真源
        if: steps.commit.outputs.changed == 'true'
        uses: actions/checkout@v5
        with:
          repository: AdminRoc/Ws-Web-core
          token: ${{ secrets.PRIVATE_REPO_PAT }}
          path: _private

      - name: 覆盖 kv_put 到工作树
        if: steps.commit.outputs.changed == 'true'
        run: cp _private/.github/scripts/kv_put.py scripts/kv_put.py

      - name: Write data to EdgeOne KV (直写 KV，不经自定义域)
        if: steps.commit.outputs.changed == 'true'
        env:
          TENCENTCLOUD_SECRET_ID: ${{ secrets.TENCENTCLOUD_SECRET_ID }}
          TENCENTCLOUD_SECRET_KEY: ${{ secrets.TENCENTCLOUD_SECRET_KEY }}
          ZONE_ID: ${{ secrets.ZONE_ID }}
          KV_NAMESPACE: ${{ secrets.KV_NAMESPACE_RELIC }}
        run: |
          set -euo pipefail
          test -n "${TENCENTCLOUD_SECRET_ID}" || { echo 'Missing TENCENTCLOUD_SECRET_ID'; exit 1; }
          test -n "${TENCENTCLOUD_SECRET_KEY}" || { echo 'Missing TENCENTCLOUD_SECRET_KEY'; exit 1; }
          test -n "${ZONE_ID}" || { echo 'Missing ZONE_ID'; exit 1; }
          test -n "${KV_NAMESPACE}" || { echo 'Missing KV_NAMESPACE_RELIC'; exit 1; }
          pip install -q tencentcloud-sdk-python cryptography
          for f in relics.json prices-summary.json reward-items.json item-categories.json item-names-zh.json relic-deep-date-summary.json relic-deep-date.json; do
            test -f "data/$f" || { echo "skip $f not exists"; continue; }
            k="${f//[.-]/_}"
            echo "KV put $k <- data/$f"
            python3 scripts/kv_put.py --zone "${ZONE_ID}" --ns "${KV_NAMESPACE}" --key "${k}" --file "data/$f"
          done
