name: Monitor Relic Deep-Date DB

on:
  workflow_dispatch:
  schedule:
    - cron: "0 1,13 * * *" # 每天 UTC 01:00 + 13:00 = 北京时间 09:00 + 21:00

concurrency:
  group: relic-data-publish
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Rebuild relic deep-date DB (wiki module + version maps + patchlogs)
        run: python scripts/build_deep_date_db.py
        env:
          # Legacy read-only compatibility until the one-time plaintext migration finishes.
          PRICE_DATA_SECRET: ${{ secrets.PRICE_DATA_SECRET }}

      - name: Show detected changes (diff vs previous run)
        run: |
          echo "=== relics changed since last commit ==="
          git diff --stat -- data/relic-deep-date.json data/relic-deep-date-summary.json
          echo "=== event-level diff (first 40 lines) ==="
          git diff -- data/relic-deep-date.json | head -80 || true

      - name: Commit and push changes
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/relic-deep-date.json data/relic-deep-date-summary.json data/update-versions.json
          if git diff --staged --quiet; then
            echo "No state changes detected"
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "data: monitor relic deep-date state changes [skip ci]"
            git pull --rebase origin main
            git push origin main
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Write deep-date data to EdgeOne KV
        env:
          KV_WRITE_TOKEN: ${{ secrets.KV_WRITE_TOKEN }}
        run: |
          set -euo pipefail
          publish() {
            local file="$1"
            local key="$2"
            python3 - "$key" "data/$file" /tmp/kv-payload.json <<'PY'
          import json, pathlib, sys
          key, source, target = sys.argv[1:]
          value = pathlib.Path(source).read_text(encoding='utf-8')
          json.loads(value)
          pathlib.Path(target).write_text(json.dumps({'key': key, 'value': value}, ensure_ascii=False), encoding='utf-8')
          PY
            curl --fail-with-body --retry 3 --retry-all-errors --max-time 300 \
              -X POST "https://relic.wfspeed.run/api/update-kv" \
              -H "Authorization: Bearer ${KV_WRITE_TOKEN}" \
              -H "Content-Type: application/json" --data-binary @/tmp/kv-payload.json
            python3 - "$key" "data/$file" <<'PY'
          import hashlib, sys, urllib.request
          key, source = sys.argv[1:]
          expected = open(source, 'rb').read()
          with urllib.request.urlopen('https://relic.wfspeed.run/api/kv?key=' + key, timeout=60) as response:
              actual = response.read()
          if hashlib.sha256(actual).digest() != hashlib.sha256(expected).digest():
              raise SystemExit('readback hash mismatch for ' + key)
          PY
          }
          publish relic-deep-date.json relic_deep_date_json
          publish relic-deep-date-summary.json relic_deep_date_summary_json
