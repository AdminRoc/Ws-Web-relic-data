name: Monitor Relic Deep-Date DB

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Update Relic & Price Data"]
    types: [completed]
  schedule:
    - cron: "0 1,13 * * *" # 每天 UTC 01:00 + 13:00 = 北京时间 09:00 + 21:00

concurrency:
  group: relic-data-publish
  cancel-in-progress: false

permissions:
  actions: read
  contents: write

jobs:
  trigger-guard:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    outputs:
      should_run: ${{ steps.guard.outputs.should_run }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify the parent relic producer job succeeded
        id: guard
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          PARENT_RUN_ID: ${{ github.event.workflow_run.id }}
        run: python scripts/relic_monitor_guard.py

  monitor:
    needs: trigger-guard
    if: needs.trigger-guard.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run relic identity and release safety tests
        run: python -m unittest discover -s tests -v

      - name: Rebuild relic deep-date DB (wiki module + version maps + patchlogs)
        run: python scripts/build_deep_date_db.py
        env:
          # Legacy read-only compatibility until the one-time plaintext migration finishes.
          PRICE_DATA_SECRET: ${{ secrets.PRICE_DATA_SECRET }}

      - name: Verify complete lifecycle coverage and canonical rewards
        run: |
          python scripts/relic_release.py

      - name: Build relic release manifest
        run: python3 scripts/build_release_manifest.py

      - name: Show detected changes (diff vs previous run)
        run: |
          echo "=== relics changed since last commit ==="
          git diff --stat -- data/relic-deep-date.json data/relic-deep-date-summary.json
          echo "=== event-level diff (first 40 lines) ==="
          git diff -- data/relic-deep-date.json | head -80 || true

      - name: Commit and push changes
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/relic-deep-date.json data/relic-deep-date-summary.json data/update-versions.json data/release-manifest.json
          if git diff --staged --quiet; then
            echo "No state changes detected"
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "data: monitor relic deep-date state changes [skip ci]"
            git pull --rebase origin main
            git push origin main
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Verify and publish relic raw release pointer
        env:
          KV_WRITE_TOKEN: ${{ secrets.KV_WRITE_TOKEN }}
        run: python3 scripts/publish_release_pointer.py