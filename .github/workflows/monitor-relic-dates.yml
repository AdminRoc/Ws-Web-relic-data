name: Monitor Relic Deep-Date DB

on:
  workflow_dispatch:
  schedule:
    - cron: '0 1,13 * * *'   # 每天 UTC 01:00 + 13:00 = 北京时间 09:00 + 21:00

concurrency:
  group: relic-deep-date
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 安装加密依赖
        run: pip install cryptography -q

      - name: Rebuild relic deep-date DB (wiki module + version maps + patchlogs)
        run: python scripts/build_deep_date_db.py
        env:
          PRICE_DATA_SECRET: ${{ secrets.PRICE_DATA_SECRET }}

      - name: Show detected changes (diff vs previous run)
        run: |
          echo "=== relics changed since last commit ==="
          git diff --stat -- data/relic-deep-date.json data/relic-deep-date-summary.json
          echo "=== event-level diff (first 40 lines) ==="
          git diff -- data/relic-deep-date.json | head -80 || true

      - name: Commit and push changes
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/relic-deep-date.json data/relic-deep-date-summary.json data/update-versions.json
          if git diff --staged --quiet; then
            echo "No state changes detected"
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "data: monitor relic deep-date state changes [skip ci]"
            git pull --rebase origin main
            git push origin main
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Write summary to EdgeOne KV
        if: steps.commit.outputs.changed == 'true'
        env:
          KV_WRITE_TOKEN: ${{ secrets.KV_WRITE_TOKEN }}
        run: |
          python3 -c "import json; content=open('data/relic-deep-date-summary.json').read(); open('/tmp/kv-payload.json','w').write(json.dumps({'key':'relic_deep_date_summary_json','value':content}))"
          code=""
          for attempt in 1 2 3; do
            code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 300 \
              -X POST "https://relic.wfspeed.run/api/update-kv" \
              -H "Authorization: Bearer ${KV_WRITE_TOKEN}" \
              -H "Content-Type: application/json" \
              --data-binary "@/tmp/kv-payload.json")
            if [ "$code" = "200" ]; then break; fi
            echo "kv relic_deep_date_summary_json 第 $attempt 次写入 HTTP $code，稍后重试..."
            sleep 5
          done
          if [ "$code" != "200" ]; then echo "KV 写入失败 HTTP $code"; exit 1; fi
