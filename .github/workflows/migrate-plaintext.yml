name: Validate and publish committed relic release

on:
  workflow_dispatch:

concurrency:
  group: relic-data-publish
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  validate-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current committed relic data
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - name: Verify current plaintext files and release manifest
        run: |
          python3 scripts/build_release_manifest.py --verify
          python3 - <<'PY'
          import glob, json
          files = glob.glob('data/**/*.json', recursive=True)
          for path in files:
              value = json.load(open(path, encoding='utf-8'))
              if isinstance(value, dict) and value.get('ct'):
                  raise SystemExit('encrypted artifact found: ' + path)
          print(f'VERIFY OK: {len(files)} committed JSON files')
          PY

      - name: Verify pinned raw files and publish the small pointer
        env:
          KV_WRITE_TOKEN: ${{ secrets.KV_WRITE_TOKEN }}
        run: python3 scripts/publish_release_pointer.py
